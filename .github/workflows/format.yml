name: format-check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  XMAKE_VERSION: "3.1.1"

jobs:
  clang-checks:
    name: Clang Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM apt repo
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21

      - name: Install clang-format 21
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-21
          clang-format-21 --version

      - name: Run clang-format check
        run: |
          FILES=$(find src/ -name '*.[ch]pp' -o -name '*.[ch]')
          FORMAT_ERRORS=0
          for FILE in $FILES; do
            if ! clang-format-21 -style=file "$FILE" | diff -u "$FILE" - > /dev/null; then
              echo "Formatting issue in $FILE"
              FORMAT_ERRORS=1
            fi
          done
          if [ "$FORMAT_ERRORS" -ne 0 ]; then
            echo "❌ Clang-format check failed."
            exit 1
          else
            echo "✅ Clang-format check passed."
          fi

  clang-tidy:
    name: Clang Tidy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install LLVM 21 and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget gnupg \
            build-essential git make pkg-config cmake ninja-build \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libpipewire-0.3-dev libwayland-dev libxinerama-dev
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get install -y clang-tidy-21 clang-tools-21

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}
          actions-cache-folder: .xmake-cache

      - name: Compute cache keys
        id: keys
        run: |
          echo "XMAKE_PKG_INSTALLDIR=${{ runner.temp }}/xmake-packages" >> "$GITHUB_ENV"
          echo "packages=xmake-packages-${{ runner.os }}-${{ runner.arch }}-${{ env.XMAKE_VERSION }}-${{ hashFiles('xmake.lua', 'xmake-requires.lock', 'deps/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore xmake packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/xmake-packages
          key: ${{ steps.keys.outputs.packages }}

      - name: Generate compile_commands.json
        run: |
          xmake f -y -m release
          xmake project -k compile_commands -t atmo -y

      - name: Select the files to check
        run: |
          CHANGED=$(git diff --name-only --diff-filter=d HEAD^1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          ALL=$(find src/ -name '*.cpp')
          if echo "$CHANGED" | grep -qE '^(xmake\.lua|xmake-requires\.lock|deps/|\.github/)|(^|/)\.clang-tidy$'; then
            echo "The build or lint configuration changed, checking every file."
            FILES=$ALL
          elif ! FILES=$(python3 .github/scripts/affected_sources.py clang-scan-deps-21 $(echo "$CHANGED" | grep '^src/')); then
            echo "::warning::Could not compute the include graph, checking every file."
            FILES=$ALL
          fi

          FILES=$(echo "$FILES" | sort -u | xargs)
          echo "Files to check: ${FILES:-none}"
          echo "FILES=$FILES" >> "$GITHUB_ENV"

      - name: Run clang-tidy
        if: env.FILES != ''
        run: |
          run-clang-tidy-21 -j $(nproc) -quiet -p . \
            -clang-tidy-binary clang-tidy-21 \
            $FILES
