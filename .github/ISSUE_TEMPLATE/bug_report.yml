name: Bug report
description: Report a crash, an error or an unexpected behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please check that a similar issue does not already exist before submitting.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the engine is affected?
      options:
        - Core / ECS
        - Editor
        - Luau scripting
        - Rendering
        - Physics
        - Project / Assets
        - Localization
        - Build / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open project '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      description: Paste any relevant logs, stack traces or Luau errors. This will be automatically formatted as code.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / minimal project
      description: Drag and drop screenshots, videos or a minimal project/script reproducing the issue.

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, Ubuntu 22.04, macOS 15
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU (with architecture)
      placeholder: e.g. AMD Ryzen 7 5800X (x86_64), Apple M2 (arm64)

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: e.g. NVIDIA RTX 3070 - 560.35

  - type: input
    id: ram
    attributes:
      label: RAM
      placeholder: e.g. 16 GB

  - type: dropdown
    id: build-mode
    attributes:
      label: Build configuration
      options:
        - Debug
        - Release
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit / branch
      description: Leave empty if using the latest `main`.
      placeholder: e.g. 10fbf11

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this bug has not been reported yet
          required: true
        - label: I can reproduce this bug on the latest `main`
